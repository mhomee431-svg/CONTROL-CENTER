# backend/docker-compose.free.yml
#
# FREE-TIER CLOUD variant of the local stack. Same images, tuned for ONE
# t3.micro (2GB RAM / ~20GB disk) deployed from infrastructure/free Terraform.
# Differences vs docker-compose.yml:
#   * DB/Redis are NOT published to any host port (SG has no such ports anyway)
#   * API is published on host :80 instead of :8000
#   * single uvicorn worker + celery concurrency 2 (RAM headroom)
#   * log rotation (journald/disk safety)
# Usage on server:  docker compose -f docker-compose.free.yml up -d --build
name: hyperlocal-free

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hyperlocal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperlocal_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-hyperlocal}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperlocal} -d ${POSTGRES_DB:-hyperlocal}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logopts
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logopts

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hyperlocal}:${POSTGRES_PASSWORD:-hyperlocal_dev_pw}@db:5432/${POSTGRES_DB:-hyperlocal}
      REDIS_URL: redis://redis:6379/0
      # Phase 11 fix: run alembic via an explicit command that EXITS — with
      # RUN_MIGRATIONS=true the entrypoint exec'd the default uvicorn CMD, so
      # this container never completed and blocked api/worker/beat forever.
      RUN_MIGRATIONS: "false"
    env_file:
      - path: .env
        required: false
    command: ["alembic", "upgrade", "head"]
    logging: *logopts

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hyperlocal}:${POSTGRES_PASSWORD:-hyperlocal_dev_pw}@db:5432/${POSTGRES_DB:-hyperlocal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RUN_MIGRATIONS: "false"
    env_file:
      - path: .env
        required: false
    ports:
      - "80:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    # NOTE: no --proxy-headers here — the free stack exposes the API directly
    # on :80 with no reverse proxy, so uvicorn must NOT trust X-Forwarded-For
    # (otherwise any client could spoof their IP and bypass rate limits).
    volumes:
      - uploads:/app/storage
    stop_grace_period: 30s
    logging: *logopts

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &worker-env
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hyperlocal}:${POSTGRES_PASSWORD:-hyperlocal_dev_pw}@db:5432/${POSTGRES_DB:-hyperlocal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RUN_MIGRATIONS: "false"
    env_file:
      - path: .env
        required: false
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--max-tasks-per-child=50"]
    volumes:
      - uploads:/app/storage
    stop_grace_period: 45s
    logging: *logopts

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *worker-env
    env_file:
      - path: .env
        required: false
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    logging: *logopts

volumes:
  db_data:
  redis_data:
  uploads:
