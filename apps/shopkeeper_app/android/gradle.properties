org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Suppress AAR metadata compileSdk warnings from plugins (permission_handler_android 14.x)
android.suppressUnsupportedCompileSdk=37
# Disable Kotlin incremental compilation: avoids recurring "Storage for ... .tab is already
# registered" / "Could not close incremental caches" failures in plugin subprojects after an
# interrupted/cancelled Gradle build leaves stale daemon file locks on the incremental cache.
kotlin.incremental=false
# Dart compile-time defines injected into every Gradle / Android Studio build.
# The Flutter Gradle Plugin passes this to the flutter tool as --DartDefines=<value>;
# value must be: base64(utf8)"KEY=VALUE", comma-joined per define (see
# flutter_tools build_info.dart encodeDartDefines). Decodes to:
#   SHOPKEEPER_API_BASE_URL=http://192.168.31.31:8000  (host LAN backend)
dart-defines=U0hPUEtFRVBFUl9BUElfQkFTRV9VUkw9aHR0cDovLzE5Mi4xNjguMzEuMzE6ODAwMA==
