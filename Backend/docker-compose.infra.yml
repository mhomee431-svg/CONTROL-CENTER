# docker-compose.infra.yml — Minimal LOCAL dev infrastructure (PostGIS + Redis).
#
# Purpose:
#   This is the lightweight "infra-only" stack used while developing the
#   backend NATIVELY (venv + uvicorn --reload). It starts ONLY the two stateful
#   services the API depends on, so you get fast hot-reload iteration without
#   rebuilding the API container for every code change.
#
#   For the full "production-shaped" stack (API + worker + beat + db + redis in
#   containers) use the sibling `docker-compose.yml` instead. Do NOT run both
#   stacks at the same time — they both bind host ports 5432 and 6379.
#
# Usage (from repo root):
#   docker compose -f Backend/docker-compose.infra.yml up -d
#   docker compose -f Backend/docker-compose.infra.yml ps
#   docker compose -f Backend/docker-compose.infra.yml down
#
# The exposed host ports match the defaults in Backend/.env so the natively-run
# backend (uvicorn) connects with no extra configuration:
#   DATABASE_URL = postgresql+asyncpg://postgres:postgres@localhost:5432/hyperlocal
#   REDIS_URL     = redis://localhost:6379/0
name: hyperlocal-infra

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hyperlocal}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hyperlocal}"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  db_data:
  redis_data:
