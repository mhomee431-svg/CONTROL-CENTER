[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_

# Suppress known deprecation warnings from third-party libraries (slowapi, starlette).
filterwarnings =
    ignore::DeprecationWarning:slowapi.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.*
    ignore::PendingDeprecationWarning
    error::DeprecationWarning:app.*
    error::PendingDeprecationWarning:app.*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests