# Phase 8 — gitleaks configuration.
# Extends gitleaks' default rule set; only repo-specific allowlists live here.
# Everything below is documentation / examples / the scanner itself — no real
# secrets are permitted anywhere else in the repository or its history.
[extend]
useDefault = true

[allowlist]
description = "Phase 8 — committed reference examples, docs and the scanner's own regexes"
paths = [
  '''(^|/)\.env(\.[^/]*)?\.example$''',
  '''^docs/''',
  '''(^|/)README(\..*)?$''',
  '''^scripts/security/scan_secrets\.py$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)tests?/''',
  # Firebase/Google Android client config — public identifier key, not a secret
  '''(^|/)google-services\.json$''',
  '''(^|/)build_customer_app\.bat$''',
]
