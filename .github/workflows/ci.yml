name: CI

# Trunk-based safety for a solo-maintained repo: every push runs the full
# gate, so a broken commit is caught by the machine within minutes rather
# than by a human reviewer who would only be reviewing their own work.
# A green run is the go-signal; a red run means do not tag a release.
# AWS deployments are separately gated by ENABLE_AWS_DEPLOYMENTS=true.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run obsolete. Cancelling it
# stops several copies of the same 5-minute suite from burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Commit message lint
        # Advisory, not blocking: this runs straight from main where history
        # still contains pre-convention commits ("hi", "p"), so a hard gate
        # would fail on commits nobody is going to rewrite. It reports on
        # the range so new drift is visible; see docs/WORKFLOW.md.
        continue-on-error: true
        run: npx commitlint --from origin/main --to HEAD

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend
        run: python -m pytest tests
        working-directory: backend

  infrastructure:
    name: AWS infrastructure synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: infrastructure

      - name: Type check infrastructure
        run: npm run typecheck
        working-directory: infrastructure

      - name: Synthesize AWS stacks
        run: npm run synth
        working-directory: infrastructure
        env:
          DEPLOYMENT_ENV: staging
          DOMAIN_NAME: staging.example.com
          CERTIFICATE_ARN: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
          CDK_DEFAULT_REGION: us-east-1

      - name: Build frontend container
        run: docker build --tag hyperlocal-web:ci --file Dockerfile .

      - name: Build backend container
        run: docker build --tag hyperlocal-api:ci --file backend/Dockerfile backend

  security:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy-staging:
    name: deploy staging to AWS
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_AWS_DEPLOYMENTS == 'true' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != '' &&
      vars.AWS_STAGING_DOMAIN_NAME != '' &&
      vars.AWS_STAGING_CERTIFICATE_ARN != ''
    needs: [verify, backend, infrastructure, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: aws-staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: infrastructure

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set CDK account
        run: echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Deploy staging stack
        run: npx cdk deploy --require-approval never
        working-directory: infrastructure
        env:
          DEPLOYMENT_ENV: staging
          DOMAIN_NAME: ${{ vars.AWS_STAGING_DOMAIN_NAME }}
          CERTIFICATE_ARN: ${{ vars.AWS_STAGING_CERTIFICATE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.AWS_STAGING_HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.AWS_STAGING_HOSTED_ZONE_NAME }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}

  deploy-production:
    name: deploy production to AWS
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.ENABLE_AWS_DEPLOYMENTS == 'true' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != '' &&
      vars.AWS_PRODUCTION_DOMAIN_NAME != '' &&
      vars.AWS_PRODUCTION_CERTIFICATE_ARN != ''
    needs: [verify, backend, infrastructure, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: aws-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: infrastructure

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set CDK account
        run: echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Deploy production stack
        run: npx cdk deploy --require-approval never
        working-directory: infrastructure
        env:
          DEPLOYMENT_ENV: production
          DOMAIN_NAME: ${{ vars.AWS_PRODUCTION_DOMAIN_NAME }}
          CERTIFICATE_ARN: ${{ vars.AWS_PRODUCTION_CERTIFICATE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.AWS_PRODUCTION_HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.AWS_PRODUCTION_HOSTED_ZONE_NAME }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}