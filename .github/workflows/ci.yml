name: CI

# Trunk-based safety for a solo-maintained repo: every push runs the full
# gate, so a broken commit is caught by the machine within minutes rather
# than by a human reviewer who would only be reviewing their own work.
# A green run is the go-signal; a red run means do not tag a release.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run obsolete. Cancelling it
# stops several copies of the same 5-minute suite from burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Commit message lint
        # Advisory, not blocking: this runs straight from main where history
        # still contains pre-convention commits ("hi", "p"), so a hard gate
        # would fail on commits nobody is going to rewrite. It reports on
        # the range so new drift is visible; see docs/WORKFLOW.md.
        continue-on-error: true
        run: npx commitlint --from origin/main --to HEAD

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: ignore
          retention-days: 7