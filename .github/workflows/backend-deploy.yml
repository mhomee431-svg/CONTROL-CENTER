# Phase 25 — Backend ECS (Fargate/paid-tier) deployment pipeline.
#
# This workflow replaces the legacy AWS-era pipeline that swallowed test
# failures (`|| true`) and deployed straight to production without gates.
# It now enforces the full quality battery, staging, approval and rollback.
#
# Branch model (same as backend-cd.yml — see docs/deployment/BRANCHING.md):
#   push to `develop` → battery → staging → smoke → E2E → stop.
#   push to `main`    → battery → staging → smoke → E2E → approval → production.
#
# Driver routing (mutually exclusive with .github/workflows/backend-cd.yml):
#   * DEPLOY_TARGET unset / "compose"  → backend-cd.yml (EC2 + Docker Compose) is active;
#                                       this workflow's deploy jobs all skip.
#   * DEPLOY_TARGET == "ecs"           → this pipeline is active.
name: Backend ECS — deploy (paid tier)

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
      - '.github/workflows/reusable-backend-checks.yml'
      - 'infrastructure/scripts/ecs_deploy.sh'
      - 'infrastructure/scripts/cicd_smoke_test.sh'
      - 'infrastructure/scripts/cicd_contract_check.py'
      - 'infrastructure/scripts/cicd_rollback.sh'
      - 'packages/api_contracts/**'
  workflow_dispatch:
    inputs:
      migrate_approved:
        description: 'Approve DB migration(s) the safety scan flagged DANGEROUS'
        type: boolean
        default: false

concurrency:
  group: backend-ecs-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'hyperlocal-backend' }}
  # Branch-aware moving tag: main → `latest` (production), develop → `develop`
  # (staging). The immutable `:<sha>` tag is always pushed for exact rollbacks.
  MOVING_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}

jobs:
  check:
    name: Quality gates (steps 1–8) + migration rehearsal
    uses: ./.github/workflows/reusable-backend-checks.yml
    with:
      python-version: "3.14"

  migration-gate:
    name: Migration safety gate (ECS)
    runs-on: ubuntu-latest
    needs: check
    if: ${{ vars.DEPLOY_TARGET == 'ecs' }}
    steps:
      - name: Gate dangerous migrations on approval
        run: |
          DANGEROUS="${{ needs.check.outputs.dangerous }}"
          APPROVED="${{ github.event.inputs.migrate_approved }}"
          echo "migration verdict: ${DANGEROUS:-no} | approved: ${APPROVED:-no}"
          if [ "${DANGEROUS:-no}" = "yes" ] && [ "$APPROVED" != "true" ]; then
            echo "::error::Dangerous migration(s) unapproved — refusing to auto-deploy."
            exit 1
          fi

  push-image:
    name: Build & push container image (step 8)
    runs-on: ubuntu-latest
    needs: [check, migration-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (sha + latest)
        uses: docker/build-push-action@v6
        with:
          context: backend/
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.MOVING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging ECS (step 9)
    runs-on: ubuntu-latest
    needs: [check, migration-gate, push-image]
    # develop (integration) and main (release candidate) both validate on staging.
    if: >-
      ${{ vars.STAGING_DEPLOY_ENABLED == 'true'
          && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
    environment: staging
    # One staging rollout at a time (develop and main share the staging services).
    concurrency:
      group: backend-staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll staging services (api / worker / beat)
        run: |
          set -euo pipefail
          chmod +x infrastructure/scripts/ecs_deploy.sh
          IMG="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          CLUSTER="${{ vars.ECS_CLUSTER_NAME || 'hyperlocal-cluster' }}"
          ./infrastructure/scripts/ecs_deploy.sh \
            "${{ vars.STAGING_WEB_SERVICE || 'hyperlocal-staging-web' }}" \
            "${{ vars.STAGING_WEB_SERVICE || 'hyperlocal-staging-web' }}" api "$IMG" "$AWS_REGION" "$CLUSTER"
          ./infrastructure/scripts/ecs_deploy.sh \
            "${{ vars.STAGING_WORKER_SERVICE || 'hyperlocal-staging-worker' }}" \
            "${{ vars.STAGING_WORKER_SERVICE || 'hyperlocal-staging-worker' }}" worker "$IMG" "$AWS_REGION" "$CLUSTER"
          ./infrastructure/scripts/ecs_deploy.sh \
            "${{ vars.STAGING_BEAT_SERVICE || 'hyperlocal-staging-beat' }}" \
            "${{ vars.STAGING_BEAT_SERVICE || 'hyperlocal-staging-beat' }}" beat "$IMG" "$AWS_REGION" "$CLUSTER"

  smoke-staging:
    name: Smoke test staging ECS (step 10)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: ${{ needs.deploy-staging.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x infrastructure/scripts/cicd_smoke_test.sh
          ./infrastructure/scripts/cicd_smoke_test.sh \
            --url "${{ vars.STAGING_API_URL }}" \
            --expect-env staging \
            --sha "${{ github.sha }}"

  e2e-staging:
    name: E2E contract battery (step 10b)
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-staging]
    if: ${{ needs.deploy-staging.result == 'success' && needs.smoke-staging.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: E2E — deployed API must match the committed contract
        if: ${{ vars.STAGING_API_URL != '' }}
        run: |
          python3 infrastructure/scripts/cicd_contract_check.py \
            --url "${{ vars.STAGING_API_URL }}" \
            --expect-env staging \
            --sha "${{ github.sha }}" \
            --contract packages/api_contracts/openapi.json
      - name: E2E skipped — STAGING_API_URL is not configured
        if: ${{ vars.STAGING_API_URL == '' }}
        run: echo "::warning::STAGING_API_URL is unset — the E2E contract battery was skipped."

  deploy-production:
    name: Deploy production ECS (step 12, approval gated)
    runs-on: ubuntu-latest
    # THE STAGING GATE: refuses to run after any upstream failure, so production
    # only ever receives a SHA that already passed staging. A skipped staging job
    # (staging disabled) does not block the release; a failed one always does.
    needs: [check, migration-gate, push-image, deploy-staging, smoke-staging, e2e-staging]
    if: >-
      ${{ !cancelled() && !failure()
          && github.ref == 'refs/heads/main'
          && vars.PROD_DEPLOY_ENABLED != 'false' }}
    environment: production
    concurrency:
      group: backend-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll production services (web / worker / beat)
        run: |
          set -euo pipefail
          chmod +x infrastructure/scripts/ecs_deploy.sh
          IMG="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          CLUSTER="${{ vars.ECS_CLUSTER_NAME || 'hyperlocal-cluster' }}"
          ./infrastructure/scripts/ecs_deploy.sh "${{ vars.WEB_SERVICE }}" "${{ vars.WEB_SERVICE }}" api "$IMG" "$AWS_REGION" "$CLUSTER"
          ./infrastructure/scripts/ecs_deploy.sh "${{ vars.WORKER_SERVICE }}" "${{ vars.WORKER_SERVICE }}" worker "$IMG" "$AWS_REGION" "$CLUSTER"
          ./infrastructure/scripts/ecs_deploy.sh "${{ vars.BEAT_SERVICE }}" "${{ vars.BEAT_SERVICE }}" beat "$IMG" "$AWS_REGION" "$CLUSTER"

  verify-production:
    name: Verify production health (step 13)
    runs-on: ubuntu-latest
    needs: deploy-production
    if: ${{ needs.deploy-production.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x infrastructure/scripts/cicd_smoke_test.sh
          ./infrastructure/scripts/cicd_smoke_test.sh \
            --url "${{ vars.PROD_API_URL }}" \
            --expect-env production \
            --sha "${{ github.sha }}"
      - name: Production E2E — contract parity + dependency readiness
        if: ${{ vars.PROD_API_URL != '' }}
        run: |
          python3 infrastructure/scripts/cicd_contract_check.py \
            --url "${{ vars.PROD_API_URL }}" \
            --expect-env production \
            --sha "${{ github.sha }}" \
            --contract packages/api_contracts/openapi.json

  rollback-production:
    name: Automatic rollback ECS (step 14)
    runs-on: ubuntu-latest
    needs: [deploy-production, verify-production]
    if: ${{ failure() }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll back production services
        run: |
          chmod +x infrastructure/scripts/cicd_rollback.sh
          ./infrastructure/scripts/cicd_rollback.sh --target ecs --region "$AWS_REGION" \
            --cluster "${{ vars.ECS_CLUSTER_NAME || 'hyperlocal-cluster' }}" \
            --service "${{ vars.WEB_SERVICE }}" \
            --family "${{ vars.WEB_SERVICE }}" \
            --container api \
            --image "${{ vars.PREVIOUS_IMAGE }}"