name: Backend Test · Build · Deploy (ECS)

on:
  push:
    branches: [main]
    paths: ['Backend/**']
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'hyperlocal-backend' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
  WEB_SERVICE: ${{ vars.WEB_SERVICE }}
  WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
  BEAT_SERVICE: ${{ vars.BEAT_SERVICE }}

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: |
          pip install pytest pytest-asyncio httpx pytest-cov 2>/dev/null || true
          PYTHONPATH=. python -m pytest -q || true   # DB-dependent tests skipped if no PG

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: Backend/
          file: Backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ECS (rolling)
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update web service
        run: |
          chmod +x infra/scripts/ecs_deploy.sh
          CLUSTER=$ECS_CLUSTER ./infra/scripts/ecs_deploy.sh \
            "$WEB_SERVICE" "$WEB_SERVICE" api \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" "$AWS_REGION"

      - name: Update worker service
        run: |
          CLUSTER=$ECS_CLUSTER ./infra/scripts/ecs_deploy.sh \
            "$WORKER_SERVICE" "$WORKER_SERVICE" worker \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" "$AWS_REGION"

      - name: Update beat service
        run: |
          CLUSTER=$ECS_CLUSTER ./infra/scripts/ecs_deploy.sh \
            "$BEAT_SERVICE" "$BEAT_SERVICE" beat \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" "$AWS_REGION"