name: Security

# This is an admin control centre: it can ban users, suspend shops and read
# audit trails. A dependency advisory here is a risk to the whole platform,
# not just to this frontend, so the scan runs on a schedule rather than only
# on push. Dependabot opens the remediation PR; this job is what proves the
# repository is actually clean.
on:
  schedule:
    # Mondays at 06:00 UTC. Off the hour so this does not pile onto the many
    # other workflows scheduled at :00.
    - cron: '17 6 * * 1'
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

# Never let two audits overlap — a queued run adds nothing.
concurrency:
  group: security
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # --audit-level=high keeps the gate on vulnerabilities that are
        # actually shipped. The full dependency tree is still uploaded below.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit summary (all severities)
        # Informational: records what exists at moderate/low so a regression
        # is visible in history even when it does not fail the build.
        run: npm audit --json > audit-report.json || true

      - name: Audit infrastructure toolchain
        run: npm audit --prefix infrastructure --json > infrastructure-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-reports
          path: |
            audit-report.json
            infrastructure-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: 'javascript-typescript'
          queries: 'security-and-quality'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:javascript-typescript'