name: Deploy Production

# Production is tag-driven on purpose. Commits are work-in-progress; a tag
# is the deliberate statement that this exact commit was verified on staging
# and is good enough for users. That separation is what keeps a bad Friday
# push from reaching the admin console.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time, queued rather than cancelled.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: ${{ vars.VERCEL_ORG_ID != '' && secrets.VERCEL_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment configuration
        run: |
          vercel pull --yes --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Record the release
        run: |
          {
            echo "### Production deployed"
            echo ""
            echo "Tag: \`${{ github.ref_name }}\`"
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Rollback: Vercel dashboard → Deployments → instant rollback,"
            echo "or redeploy the previous tag."
          } >> "$GITHUB_STEP_SUMMARY"