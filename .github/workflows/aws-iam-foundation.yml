name: AWS IAM Foundation — Validate & Verify

on:
  push:
    branches: [main]
    paths: ['infrastructure/terraform/foundation/**', '.github/workflows/aws-iam-foundation.yml', 'infrastructure/scripts/iam_verify.ps1']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  # ── 0. Static checks (no AWS credentials required) ─────────────────────────
  validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate

  # ── 1-5. Phase 2 Test steps (needs the applied foundation + verify role) ───
  verify:
    name: Verify auth / assume / simulate / service access
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.AWS_ACCOUNT_ID != '' && secrets.AWS_VERIFY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume read-only verify role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_VERIFY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run IAM verification runbook
        env:
          AWS_IAM_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          OP_ROLE_ARN: ${{ secrets.AWS_OPERATOR_ROLE_ARN }}
          CI_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          chmod +x infrastructure/scripts/iam_verify.ps1
          pwsh -File infrastructure/scripts/iam_verify.ps1 \
            -Region "$AWS_REGION" \
            -AccountId "$AWS_IAM_ACCOUNT_ID" \
            -OpRole "$OP_ROLE_ARN" \
            -CiRole "$CI_ROLE_ARN"