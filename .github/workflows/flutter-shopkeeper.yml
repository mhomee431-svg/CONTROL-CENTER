name: Flutter Shopkeeper App — Test & Build

on:
  push:
    branches: [main]
    paths: ['apps/shopkeeper_app/**']
  workflow_dispatch:

jobs:
  build:
    name: Test & build Android (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shopkeeper_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.SHOPKEEPER_API_BASE_URL }}  # e.g. https://api.hyperlocal.in (scheme + host)
        run: >
          flutter build apk --release
          --dart-define=SHOPKEEPER_API_BASE_URL=$API_BASE_URL
          --dart-define=APP_ENV=production
          --dart-define=SHOPKEEPER_ENABLE_DEMO_LOGIN=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-app-release
          path: apps/shopkeeper_app/build/app/outputs/flutter-apk/app-release.apk