# Branch model (docs/deployment/BRANCHING.md):
#   pull_request → develop/main : platform-ci.yml runs the admin checks (PR gate).
#   push to develop             : build the STAGING web artifact.
#   push to main                : build the PRODUCTION web artifact.
# The admin console is a static web bundle with no APP_ENV switch, so both
# artifacts are identical builds and differ only by artifact name.
name: Flutter Admin Panel - Test & Build

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/admin_panel/**'
      - 'packages/shared_models/**'
      - '.github/workflows/flutter-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging:
    name: Admin - build web (staging)
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_panel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release web app
        run: flutter build web --release

      - name: Upload staging web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-web-staging
          path: apps/admin_panel/build/web

  build-production:
    name: Admin - build web (production)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_panel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release web app
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-web-release
          path: apps/admin_panel/build/web