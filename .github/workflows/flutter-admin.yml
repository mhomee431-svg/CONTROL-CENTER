name: Flutter Admin Panel - Test & Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin_panel/**'
      - 'packages/shared_models/**'
      - '.github/workflows/flutter-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build web production artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_panel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release web app
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-web-release
          path: apps/admin_panel/build/web