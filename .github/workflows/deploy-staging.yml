name: Deploy Staging

# Every merge to main lands on staging, never on production. This is where a
# change is verified against a real backend before it is allowed near users.
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

# One staging deploy at a time, in order. Cancelling here would leave the
# staging domain on an older commit than main, which is worse than waiting.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Skips silently when the Vercel secrets are absent, so a fork or a
    # fresh clone does not fail on every push.
    if: ${{ vars.VERCEL_ORG_ID != '' && secrets.VERCEL_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull staging environment configuration
        run: |
          vercel pull --yes --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      # --prebuilt reuses the exact artifacts the verification step just
      # built, so what was tested is what gets served.
      - name: Deploy to staging
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Record the deployed URL
        run: |
          {
            echo "### Staging deployed"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Author: ${{ github.actor }}"
            echo ""
            echo '```'
            cat .vercel/output/url 2>/dev/null || echo "see Vercel dashboard"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"