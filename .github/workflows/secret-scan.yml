name: Secret Scan (Phase 8)

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly full-history re-scan
  workflow_dispatch:

permissions:
  contents: read
  # On a `pull_request` event gitleaks-action fetches the PR's commit list via
  # /pulls/{n}/commits. Without this scope that call returns 403 and the job
  # fails with an API error that LOOKS like a leaked secret but is not:
  #   url: 'https://api.github.com/repos/.../pulls/3/commits'
  # Granting it keeps the scan meaningful instead of failing for the wrong
  # reason -- a red secret-scan is only useful when red means "a secret".
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks (working tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan commits too
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-scanner:
    name: Local scanner (tracked files + git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: python3 scripts/security/scan_secrets.py --tracked
      - name: Scan full git history
        run: python3 scripts/security/scan_secrets.py --history
